name: Transcribe Audio

# Place this file at .github/workflows/transcribe-2.yml in the repository.
# The Python scripts (transcribe.py, extract_audio_url.py,
# download_youtube_audio.py, translate_transcript.py) live at the repository root.
#
# Sources: a NotebookLM Audio Overview share link OR a single YouTube video link.
# v9 (free tier, <= 30 min): streaming + short first-token timeouts, per-model circuit
# breaker, hedged requests while congested, merged review+proofreading pass, enforced glossary.
# Tip: 503 peaks roughly 9:00-18:00 Pacific time; running outside those hours is faster.
# Optional secrets: MISTRAL_API_KEY, GROQ_API_KEY (backup providers, free keys), GEMINI_API_KEY (translation; GEMINI_API_KEY_2 ... _5 are
# optional extra keys that are rotated automatically - create each one in a
# DIFFERENT Google Cloud project, free-tier quotas are per project, not per key),
# Resume: the Whisper transcript and the translation checkpoint are stored with
# actions/cache (key = hash of the LINK ONLY). When reuse_previous is ticked
# (off by default), re-running the SAME link restores them whatever name /
# format / model you pick now, skips download + transcription, and translates
# only what is still missing (free-tier quotas reset at midnight Pacific time).
# The restored transcript keeps its original format and the output keeps the
# name it was first created with (unless you type a different name).
# YOUTUBE_COOKIES (paste the
# text of a cookies.txt from a throwaway YouTube account; usually needed
# because YouTube blocks GitHub's datacenter IPs). YOUTUBE_COOKIES_B64
# (the same file base64-encoded) is also accepted.

on:
  workflow_dispatch:
    inputs:
      share_url:
        description: 'NotebookLM Audio Overview share link OR YouTube video link'
        required: true
        type: string
      base_name:
        description: 'Output file base name (optional; any name is accepted and cleaned automatically, Arabic letters are kept)'
        required: false
        default: 'transcript'
        type: string
      output_format:
        description: 'Output format (txt = one complete sentence per entry, srt = timed cues)'
        required: false
        default: 'srt'
        type: choice
        options:
          - srt
          - txt
      model_size:
        description: 'Whisper model size'
        required: false
        default: 'small'
        type: choice
        options:
          - tiny
          - base
          - small
          - medium
          - large-v2
          - large-v3
          - large-v3-turbo
          - distil-large-v3

      reuse_previous:
        description: 'Reuse the transcript + translation checkpoint of a previous run of the same link (skips transcription; name/format/model are taken from the previous run)'
        required: false
        default: false
        type: boolean
      translate:
        description: 'Translate transcript to Arabic with Gemini'
        required: false
        default: true
        type: boolean
      translation_output:
        description: 'Translation output'
        required: false
        default: 'arabic'
        type: choice
        options:
          - arabic
          - bilingual
          - both
      gemini_model:
        description: 'Primary Gemini model (others are used automatically as fallback)'
        required: false
        default: 'gemini-3.8-flash'
        type: choice
        options:
          - gemini-3.8-flash
          - gemini-3.6-flash
          - gemini-3-flash-preview
          - gemini-2.5-flash
      clean_audio:
        description: 'srt only: isolate the voice from music / songs / noise (Demucs) before transcribing. Slower (about the video length) but far better with background music'
        required: false
        default: true
        type: boolean
      speakers:
        description: 'srt only: detect different speakers; a cue with two speakers is written as two lines, each starting with a dash (-)'
        required: false
        default: true
        type: boolean
      save_video:
        description: 'YouTube links only: also save the VIDEO (.mp4) as a separate downloadable file in the run artifacts (no zip, plays on a phone)'
        required: false
        default: false
        type: boolean
      video_quality:
        description: 'Max video height when save_video is ticked (lower = smaller file)'
        required: false
        default: '720'
        type: choice
        options:
          - '360'
          - '480'
          - '720'
          - '1080'
      fast:
        description: 'أسرع (Faster): use Lite models only (Gemini Flash-Lite) for every translation stage; no Flash, Gemma or backup models. Lower quality, much larger daily quota'
        required: false
        default: false
        type: boolean
      translate_max_minutes:
        description: 'Translation time budget in minutes, 10-200 (set it higher for long audio; the step timeout follows it automatically)'
        required: false
        default: '30'
        type: string

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    # Untrusted inputs are passed through environment variables and only ever
    # referenced as quoted shell variables ("$VAR"), never expanded inline with
    # ${{ }} inside `run:` scripts (prevents script injection).
    env:
      SHARE_URL: ${{ github.event.inputs.share_url }}
      BASE_NAME: ${{ github.event.inputs.base_name }}
      OUTPUT_FORMAT: ${{ github.event.inputs.output_format }}
      MODEL_SIZE: ${{ github.event.inputs.model_size }}
      TRANSLATION_OUTPUT: ${{ github.event.inputs.translation_output }}
      GEMINI_MODEL: ${{ github.event.inputs.gemini_model }}
      SAVE_VIDEO: ${{ github.event.inputs.save_video }}
      CLEAN_AUDIO: ${{ github.event.inputs.clean_audio }}
      SPEAKERS: ${{ github.event.inputs.speakers == 'true' && 'on' || 'off' }}
      VIDEO_QUALITY: ${{ github.event.inputs.video_quality }}

    steps:
      # Normalize free-form inputs. Any file name is accepted: it is cleaned
      # (Unicode letters/digits and '-' are kept, everything else becomes '_',
      # max 80 chars, empty -> "transcript") and the final name is announced.
      # The link is trimmed. Raw values are never echoed into workflow commands.
      - name: Normalize inputs
        run: |
          python3 - <<'PY'
          import os, re, sys
          env_file = os.environ["GITHUB_ENV"]
          raw = os.environ.get("BASE_NAME", "")
          name = "".join(c if (c.isalnum() or c == "-") else "_" for c in raw.strip())
          name = re.sub(r"_+", "_", name).strip("_-")[:80].strip("_-") or "transcript"
          url = os.environ.get("SHARE_URL", "").strip()
          if not url or re.search(r"\s", url):
              print("::error::share_url must be a single link without spaces inside it.")
              sys.exit(1)
          with open(env_file, "a", encoding="utf-8") as f:
              f.write(f"SAFE_NAME={name}\nCLEAN_URL={url}\n")
          msg = f"Output file base name: {name}"
          if name != raw:
              print(f"::notice::{msg} (the requested name was adjusted to a safe file name)")
          else:
              print(msg)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(f"### Output name: `{name}`\n")
          PY

      # Fail fast: catch bad inputs / a missing API key BEFORE spending
      # minutes on installs and transcription. Also decides the audio SOURCE.
      - name: Validate inputs
        env:
          TRANSLATE: ${{ github.event.inputs.translate }}
          HAS_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          YT_RE='^https://(((www|m|music)\.)?youtube\.com|youtu\.be)/'
          NLM_RE='^https://([A-Za-z0-9-]+\.)+google(\.com)?([/?#]|$)'
          if [[ "$CLEAN_URL" =~ $YT_RE ]]; then
            SOURCE=youtube
          elif [[ "$CLEAN_URL" =~ $NLM_RE ]]; then
            SOURCE=notebooklm
          else
            echo "::error::share_url must be an https NotebookLM (Google) link or a youtube.com / youtu.be video link."
            exit 1
          fi
          if [[ "$TRANSLATE" == "true" && "$HAS_GEMINI_KEY" != "true" ]]; then
            echo "::error::Translation is enabled but the GEMINI_API_KEY repository secret is not set."
            exit 1
          fi
          echo "Audio source: $SOURCE"
          echo "SOURCE=$SOURCE" >> "$GITHUB_ENV"
          KEY="$(printf '%s' "$CLEAN_URL" | sha1sum | cut -c1-16)"
          echo "TCACHE=transcribe-link-$KEY" >> "$GITHUB_ENV"
          echo "FMT=$OUTPUT_FORMAT" >> "$GITHUB_ENV"

      - name: Validate translation time budget
        env:
          BUDGET: ${{ github.event.inputs.translate_max_minutes }}
        run: |
          if [[ ! "${BUDGET:-30}" =~ ^[0-9]+$ ]] || (( ${BUDGET:-30} < 10 || ${BUDGET:-30} > 200 )); then
            echo "::error::translate_max_minutes must be a whole number between 10 and 200."
            exit 1
          fi
          echo "Translation budget: ${BUDGET:-30} minutes"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore previous transcript and translation checkpoint
        id: prev
        if: ${{ github.event.inputs.reuse_previous == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: resume_cache
          key: ${{ env.TCACHE }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.TCACHE }}-

      # The cache holds fixed file names (resume_cache/transcript.<fmt>, meta.txt,
      # progress.json) so it does not depend on the name/format chosen this time.
      - name: Decide whether transcription can be skipped
        env:
          MATCHED: ${{ steps.prev.outputs.cache-matched-key }}
          NAME_TYPED: ${{ github.event.inputs.base_name }}
        run: |
          if [[ -n "$MATCHED" ]]; then
            T="$(ls resume_cache/transcript.* 2>/dev/null | head -n1 || true)"
            if [[ -n "$T" && -s "$T" ]]; then
              PREV_FMT="${T##*.}"
              PREV_NAME="$(sed -n 's/^name=//p' resume_cache/meta.txt 2>/dev/null | head -n1)"
              # Keep the previous name unless a different one was typed this time.
              if [[ -n "$PREV_NAME" && ( -z "$NAME_TYPED" || "$NAME_TYPED" == "transcript" ) ]]; then
                SAFE_NAME="$PREV_NAME"
              fi
              cp "$T" "$SAFE_NAME.$PREV_FMT"
              [[ -f resume_cache/progress.json ]] && cp resume_cache/progress.json "${SAFE_NAME}_progress.json"
              echo "Restored transcript from cache ($MATCHED) - download and transcription are skipped."
              echo "::notice::Reusing the previous transcript (format: $PREV_FMT, name: $SAFE_NAME)."
              {
                echo "HAVE_TRANSCRIPT=true"
                echo "FMT=$PREV_FMT"
                echo "SAFE_NAME=$SAFE_NAME"
              } >> "$GITHUB_ENV"
              ls -l "$SAFE_NAME"* || true
              exit 0
            fi
          fi
          echo "No previous transcript found - full run."
          rm -rf resume_cache

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg and aria2
        if: ${{ env.HAVE_TRANSCRIPT != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2

      - name: Install faster-whisper
        if: ${{ env.HAVE_TRANSCRIPT != 'true' }}
        run: |
          pip install "faster-whisper>=1.2.1,<2"

      - name: Install Playwright (NotebookLM source)
        if: ${{ env.SOURCE == 'notebooklm' && env.HAVE_TRANSCRIPT != 'true' }}
        run: |
          pip install "playwright>=1.40,<2"
          playwright install --with-deps chromium

      # YouTube breaks older yt-dlp builds quickly, so always take the latest.
      # "[default]" brings the yt-dlp-ejs challenge solver; it needs a JS runtime (Deno).
      - name: Install yt-dlp and Deno (YouTube source)
        if: ${{ env.SOURCE == 'youtube' && (env.HAVE_TRANSCRIPT != 'true' || env.SAVE_VIDEO == 'true') }}
        run: |
          pip install -U "yt-dlp[default]"
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          "$HOME/.deno/bin/deno" --version
          yt-dlp --version

      - name: Cache Whisper model
        if: ${{ env.HAVE_TRANSCRIPT != 'true' }}
        uses: actions/cache@v4
        with:
          # faster-whisper downloads model weights via huggingface_hub,
          # which stores them here by default. Caching this path avoids
          # re-downloading the same model on every run.
          path: ~/.cache/huggingface
          # Keyed on the selected model size so switching sizes just adds
          # a new cache entry instead of invalidating the old one.
          key: hf-whisper-${{ github.event.inputs.model_size }}

      # ---------------------------------------------------- source: NotebookLM
      - name: Extract direct audio URL from share link
        if: ${{ env.SOURCE == 'notebooklm' && env.HAVE_TRANSCRIPT != 'true' }}
        run: |
          python extract_audio_url.py "$CLEAN_URL" "$RUNNER_TEMP/audio_url.txt"
          # The signed URL grants access to the audio: keep it out of the logs
          # (and out of the uploaded artifact, so it lives in RUNNER_TEMP).
          echo "::add-mask::$(cat "$RUNNER_TEMP/audio_url.txt")"

      - name: Download audio from extracted direct link
        if: ${{ env.SOURCE == 'notebooklm' && env.HAVE_TRANSCRIPT != 'true' }}
        run: |
          # The captured googlevideo.com URL is signed/IP-locked and time-limited,
          # so a single-connection curl download was the main bottleneck for
          # large audio files. aria2c splits the download into parallel
          # connections against the same URL (the host supports HTTP Range
          # requests), which cuts download time dramatically while keeping
          # the same retry/User-Agent behavior.
          aria2c \
            --header="User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=1M \
            --max-tries=3 \
            --retry-wait=2 \
            --continue=true \
            --allow-overwrite=true \
            --console-log-level=warn \
            --summary-interval=5 \
            --out=input_audio.mp4 \
            "$(cat "$RUNNER_TEMP/audio_url.txt")"
          echo "AUDIO_FILE=input_audio.mp4" >> "$GITHUB_ENV"

      # ------------------------------------------------------ source: YouTube
      - name: Download audio from YouTube
        if: ${{ env.SOURCE == 'youtube' && env.HAVE_TRANSCRIPT != 'true' }}
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          YOUTUBE_MAX_MINUTES: '240'
        run: |
          python download_youtube_audio.py "$CLEAN_URL" input_audio "$RUNNER_TEMP/audio_file.txt"
          NAME="$(cat "$RUNNER_TEMP/audio_file.txt")"
          if [[ ! "$NAME" =~ ^input_audio\.[A-Za-z0-9]{1,5}$ ]]; then
            echo "::error::Unexpected audio file name from the downloader."
            exit 1
          fi
          echo "AUDIO_FILE=$NAME" >> "$GITHUB_ENV"

      # ------------------------------------------------------------ common
      - name: Verify download
        if: ${{ env.HAVE_TRANSCRIPT != 'true' }}
        run: |
          ls -lh "$AUDIO_FILE"
          SIZE=$(stat -c %s "$AUDIO_FILE")
          if [[ "$SOURCE" == "notebooklm" ]]; then
            # googlevideo URLs carry the full file size as `clen`: a mismatch
            # means a truncated/partial download that would silently lose audio.
            CLEN=$(grep -oP '[?&]clen=\K[0-9]+' "$RUNNER_TEMP/audio_url.txt" || true)
            if [[ -n "$CLEN" && "$SIZE" -ne "$CLEN" ]]; then
              echo "::error::Downloaded $SIZE bytes but the server reports $CLEN bytes (partial download)."
              exit 1
            fi
          fi
          DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$AUDIO_FILE" || true)
          echo "duration=$DUR"
          if ! awk -v d="$DUR" 'BEGIN { exit !(d + 0 > 0) }'; then
            echo "::error::The downloaded file has no readable audio duration."
            exit 1
          fi

      # srt only. Isolates the voice (Demucs "vocals" stem) so music, songs and noise do
      # not hide speech. Best effort: on any failure the original audio is used.
      - name: Isolate voice from music and noise (Demucs)
        if: ${{ env.HAVE_TRANSCRIPT != 'true' && env.FMT == 'srt' && env.CLEAN_AUDIO == 'true' }}
        continue-on-error: true
        run: |
          pip install --quiet torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet demucs==4.0.1 soundfile "numpy<2"
          rm -rf demucs_out
          python -m demucs --two-stems=vocals -n htdemucs -d cpu -j 2 -o demucs_out "$AUDIO_FILE"
          VOCALS="$(find demucs_out -name vocals.wav | head -n 1)"
          test -n "$VOCALS"
          # The cleaned track must last EXACTLY as long as the original so cue times match the audio.
          ORIG=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$AUDIO_FILE")
          ffmpeg -v error -y -i "$VOCALS" -ac 1 -ar 16000 -af "highpass=f=70,loudnorm=I=-18:TP=-1.5:LRA=11,apad" -t "$ORIG" cleaned_voice.wav
          DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 cleaned_voice.wav)
          awk -v d="$DUR" -v o="$ORIG" 'BEGIN { x = d - o; if (x < 0) x = -x; exit !(d + 0 > 0 && x < 0.1) }'
          echo "AUDIO_FILE=cleaned_voice.wav" >> "$GITHUB_ENV"
          echo "AUDIO_CLEANED=1" >> "$GITHUB_ENV"
          echo "Voice isolated: cleaned_voice.wav ($DUR s)"

      # srt only. Speaker detection models (sherpa-onnx, CPU, no account/token needed).
      - name: Prepare speaker detection (sherpa-onnx)
        if: ${{ env.HAVE_TRANSCRIPT != 'true' && env.FMT == 'srt' && env.SPEAKERS == 'on' }}
        continue-on-error: true
        run: |
          pip install --quiet sherpa-onnx "numpy<2"
          D="$RUNNER_TEMP/diarize"; mkdir -p "$D"
          B=https://github.com/k2-fsa/sherpa-onnx/releases/download
          curl -fL --retry 3 --retry-delay 5 -o "$D/seg.tar.bz2" "$B/speaker-segmentation-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2"
          tar -xjf "$D/seg.tar.bz2" -C "$D"
          cp "$(find "$D" -name model.onnx | head -n 1)" "$D/segmentation.onnx"
          curl -fL --retry 3 --retry-delay 5 -o "$D/embedding.onnx" "$B/speaker-recongition-models/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx"
          ls -lh "$D/segmentation.onnx" "$D/embedding.onnx"
          echo "SHERPA_DIARIZE_DIR=$D" >> "$GITHUB_ENV"

      - name: Transcribe with faster-whisper
        if: ${{ env.HAVE_TRANSCRIPT != 'true' }}
        run: |
          python transcribe.py "$AUDIO_FILE" "$SAFE_NAME.$FMT" "$FMT" "$MODEL_SIZE"

      - name: Translate to Arabic with Gemini
        if: ${{ github.event.inputs.translate == 'true' }}
        # GitHub expressions have no arithmetic, so the step cap is fixed at the maximum budget
        # (200) + 20 min margin. The real limit is enforced by the script itself
        # (TRANSLATE_MAX_MINUTES), which saves partial output + checkpoint when it is reached.
        timeout-minutes: 220
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRANSLATE_FAST: ${{ github.event.inputs.fast == 'true' && 'on' || 'off' }}
          # Optional extra keys (empty secrets are ignored by the script).
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          # Optional backup providers (free keys). Empty/missing secret = that tier is skipped silently.
          # Mistral's free Experiment plan may use requests for model training; Groq free is tightly
          # rate-limited (small batches are used automatically). Output of these tiers is a draft:
          # it is flagged and re-translated/reviewed by Gemini when available.
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # TRANSLATE_BACKUP: off          # disable the backup tier entirely
          # BACKUP_ORDER: mistral,groq     # preferred order (adapts to measured quality)          # Global time budget inside the script (stages get fixed shares of it).
          TRANSLATE_MAX_MINUTES: ${{ github.event.inputs.translate_max_minutes }}
          # Translation thinking: low (default) | medium | high | off
          # GEMINI_THINKING_LEVEL: low
          # Context pass thinking (one request on a bounded sample): medium (default)
          # CONTEXT_THINKING: medium
          # Optional: max parallel requests (default min(3, number of keys))
          # TRANSLATE_PARALLEL: '4'   (default 4; lowered automatically on 503, restored after successes)
          # Optional: override the quality chain (comma-separated). Lite models are
          # a last resort only (GEMINI_LAST_RESORT_MODELS) and their output is reviewed.
          # GEMINI_FALLBACK_MODELS: gemini-3.6-flash,gemini-3-flash-preview,gemini-2.5-flash
          # Optional: review model for suspect paragraphs (default = quality chain;
          # "off" disables) and the cap for non-lite suspects
          # TRANSLATE_REVIEW_MODEL: off
          # TRANSLATE_REVIEW_MAX: '30'  (suspect units sent to the merged MQM review; the rest are proofread)
          # Optional: Gemma 4 middle tier (used when Flash fails twice; always reviewed by Flash)
          # TRANSLATE_GEMMA: off
          # GEMMA_MODELS: gemma-4-31b-it,gemma-4-26b-a4b-it
        run: |
          python translate_transcript.py \
            "$SAFE_NAME.$FMT" \
            "$SAFE_NAME" \
            "$TRANSLATION_OUTPUT" \
            "$GEMINI_MODEL"

      # Keep transcript + checkpoint for the next run of the same link (also on failure).
      - name: Prepare resume cache
        id: pack
        if: ${{ always() && !cancelled() && env.TCACHE != '' }}
        run: |
          if [[ -s "$SAFE_NAME.$FMT" ]]; then
            rm -rf resume_cache && mkdir resume_cache
            cp "$SAFE_NAME.$FMT" "resume_cache/transcript.$FMT"
            [[ -f "${SAFE_NAME}_progress.json" ]] && cp "${SAFE_NAME}_progress.json" resume_cache/progress.json
            echo "name=$SAFE_NAME" > resume_cache/meta.txt
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save transcript and checkpoint for resume
        if: ${{ always() && !cancelled() && steps.pack.outputs.ready == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: resume_cache
          key: ${{ env.TCACHE }}-${{ github.run_id }}

      - name: Flag incomplete translation
        if: ${{ always() && env.SAFE_NAME != '' && github.event.inputs.translate == 'true' }}
        run: |
          REPORT="${SAFE_NAME}_report.txt"
          [[ -f "$REPORT" ]] || exit 0
          N="$(grep -oP '== Units to redo on the next run[^:]*: \K[0-9]+' "$REPORT" || echo 0)"
          if [[ "${N:-0}" -gt 0 ]]; then
            echo "::warning::$N paragraph(s) are untranslated or came from a lite/Gemma model and were not reviewed. Run this workflow again with the SAME link after the Gemini daily quota resets (midnight Pacific time); only those paragraphs are redone."
            echo "### Translation incomplete: $N paragraph(s) pending - re-run with the same link after the quota reset." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Runs even if an earlier step failed, so the Whisper transcript, any
      # partial translation and the extraction screenshot (debug_extract.png,
      # only present on extraction failure) are never lost. The job still ends
      # red on failure.
      # Optional: the YouTube video itself (.mp4), uploaded UNZIPPED as its own
      # artifact so it can be opened/played directly after downloading it on a
      # phone. It runs after everything else and never fails the job.
      - name: Download video from YouTube
        if: ${{ !cancelled() && env.SOURCE == 'youtube' && env.SAVE_VIDEO == 'true' && env.SAFE_NAME != '' }}
        continue-on-error: true
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          YOUTUBE_MAX_MINUTES: '240'
          YOUTUBE_VIDEO_MAX_MB: '1500'
        run: |
          python download_youtube_video.py "$CLEAN_URL" video_download "$RUNNER_TEMP/video_file.txt" "${VIDEO_QUALITY:-720}"
          NAME="$(cat "$RUNNER_TEMP/video_file.txt")"
          if [[ "$NAME" != "video_download.mp4" ]]; then
            echo "::error::Unexpected video file name from the downloader."
            exit 1
          fi
          mkdir -p video_out
          mv "$NAME" "video_out/${SAFE_NAME}.mp4"
          echo "VIDEO_READY=true" >> "$GITHUB_ENV"

      - name: Upload video artifact
        if: ${{ !cancelled() && env.VIDEO_READY == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          path: video_out/${{ env.SAFE_NAME }}.mp4
          archive: false
          retention-days: 14

      - name: Upload transcript artifact
        if: ${{ !cancelled() && env.SAFE_NAME != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SAFE_NAME }}
          path: |
            ${{ env.SAFE_NAME }}*.${{ env.FMT }}
            ${{ env.SAFE_NAME }}_report.txt
            ${{ env.SAFE_NAME }}_progress.json
            debug_extract.png
          retention-days: 14
